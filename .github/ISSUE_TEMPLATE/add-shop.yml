name: Shop
description: Add a shop to monitor, re-point it, or remove it.
title: "[shop] "
labels: ["add-shop"]
body:
  - type: markdown
    attributes:
      value: |
        Applied automatically once submitted — tests run first, then it
        commits to `main`. No pull request to merge.

        New and re-pointed shops land as `verified: false`. Run the
        **Probe Shops** workflow afterwards to detect the platform and
        confirm the shop before it goes live.
  - type: input
    id: name
    attributes:
      label: Short name
      description: Lowercase, no spaces. Existing name to update, new name to add.
      placeholder: lescaves
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Shop URL
      description: Base address, https only. Not needed when removing.
      placeholder: https://example.com
  - type: checkboxes
    id: remove
    attributes:
      label: Danger zone
      options:
        - label: Remove this shop instead (uses the name above)

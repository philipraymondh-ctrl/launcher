name: Apply Config Issue

# Turns a Producer / Shop issue form into a committed config change.
#
# Commits straight to main rather than opening a pull request: the owner is
# the only person who can trigger it, the full test suite must pass first,
# and everything is revertible through git. Requiring a PR merge for "change
# a price" was pure ceremony.
#
# SECURITY: this repo is public, so anyone can open an issue and issue forms
# apply their own labels. The job refuses to run unless the issue author is
# the repo OWNER -- otherwise a stranger could drive edits to scraper.py.
# apply_issue.py independently rejects hostile values (quote injection, path
# traversal, non-https URLs); this gate is the outer of the two.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    # Matches on the form's own headings as well as the label. GitHub only
    # applies a template's labels if they already exist in the repo, so a
    # missing label silently skipped a correctly-submitted form -- which is
    # exactly what happened to issue #20. The OWNER check is the security
    # gate and is unaffected; the heading match just identifies which form.
    if: >
      github.event.issue.author_association == 'OWNER' &&
      (contains(github.event.issue.labels.*.name, 'add-producer') ||
       contains(github.event.issue.labels.*.name, 'add-shop') ||
       contains(github.event.issue.body, '### Producer name') ||
       contains(github.event.issue.body, '### Short name'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide what kind of request this is
        id: kind
        env:
          IS_PRODUCER_LABEL: ${{ contains(github.event.issue.labels.*.name, 'add-producer') }}
          IS_SHOP_LABEL: ${{ contains(github.event.issue.labels.*.name, 'add-shop') }}
          HAS_PRODUCER_HEADING: ${{ contains(github.event.issue.body, '### Producer name') }}
        run: |
          if [ "$IS_PRODUCER_LABEL" = "true" ] || \
             { [ "$IS_SHOP_LABEL" != "true" ] && [ "$HAS_PRODUCER_HEADING" = "true" ]; }; then
            echo "kind=producer" >> "$GITHUB_OUTPUT"
          else
            echo "kind=shop" >> "$GITHUB_OUTPUT"
          fi

      - name: Write issue body to a file
        env:
          # Via env, never inlined into the script, so the body cannot be
          # interpreted as shell.
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > issue_body.md

      - name: Apply the change
        id: apply
        run: |
          python apply_issue.py --kind "${{ steps.kind.outputs.kind }}" --body-file issue_body.md
          {
            echo 'summary<<APPLY_EOF'
            cat apply_summary.txt
            echo
            echo 'APPLY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Regenerate dashboard
        run: python dashboard.py

      # Nothing is committed unless the suite is green, so a malformed edit
      # can never land on main.
      - name: Run tests
        run: pytest tests/ -q

      - name: Commit to main
        run: |
          rm -f issue_body.md apply_summary.txt
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "no_changes=true" >> "$GITHUB_ENV"
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Config change from issue #${{ github.event.issue.number }}

          ${{ steps.apply.outputs.summary }}

          Applied by .github/workflows/apply-config.yml after tests passed."
          git push
          echo "committed=true" >> "$GITHUB_ENV"

      - name: Comment and close the issue
        uses: actions/github-script@v7
        env:
          # Via env, never interpolated into the script body: the summary
          # contains backticks, which closed the template literal early and
          # crashed this step *after* the commit had landed -- so the
          # failure handler then reported "nothing was committed", which
          # was false.
          APPLY_SUMMARY: ${{ steps.apply.outputs.summary }}
        with:
          script: |
            const noChanges = process.env.no_changes === 'true';
            const summary = process.env.APPLY_SUMMARY || '';
            const sha = require('child_process').execSync('git rev-parse HEAD').toString().trim();
            const link = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${sha}`;
            const body = noChanges
              ? 'Nothing to change — the config already looks like that.'
              : 'Applied and pushed to `main` — [' + sha.slice(0, 7) + '](' + link + ').\n\n' + summary;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body + "\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_",
            });
            await github.rest.issues.update({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, state: 'closed',
            });

      - name: Report failure on the issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: (process.env.committed === 'true'
                ? 'The change **was committed to `main`**, but a later step of the run failed. '
                  + 'Check the config before retrying -- re-applying the label would apply it twice. '
                : 'Could not apply this, and nothing was committed. ')
                + `See the [run log](${run}) for details.`
                + "\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_",
            });

name: Apply Config Issue

# Turns an "Add a producer" / "Add a shop" issue form into a pull request.
#
# SECURITY: this repo is public, so anyone can open an issue, and issue
# forms apply their own labels. The job therefore refuses to run unless the
# issue author is the repo OWNER -- otherwise a stranger could drive edits
# to scraper.py. apply_issue.py validates and rejects hostile values too
# (quote injection, path traversal, non-https URLs); this gate is the outer
# of the two. Output is always a PR, never a push to main.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  apply:
    if: >
      github.event.issue.author_association == 'OWNER' &&
      (contains(github.event.issue.labels.*.name, 'add-producer') ||
       contains(github.event.issue.labels.*.name, 'add-shop'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decide what kind of request this is
        id: kind
        run: |
          if [ "${{ contains(github.event.issue.labels.*.name, 'add-producer') }}" = "true" ]; then
            echo "kind=producer" >> "$GITHUB_OUTPUT"
          else
            echo "kind=shop" >> "$GITHUB_OUTPUT"
          fi

      - name: Write issue body to a file
        env:
          # Via env, never inlined into the script, so the body cannot be
          # interpreted as shell.
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > issue_body.md

      - name: Apply the change
        id: apply
        run: |
          python apply_issue.py --kind "${{ steps.kind.outputs.kind }}" --body-file issue_body.md
          {
            echo 'summary<<APPLY_EOF'
            cat apply_summary.txt
            echo
            echo 'APPLY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Regenerate dashboard
        run: python dashboard.py

      - name: Run tests
        run: pytest tests/ -q

      - name: Clean up scratch files
        run: rm -f issue_body.md apply_summary.txt

      - name: Open pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: config/issue-${{ github.event.issue.number }}
          base: main
          title: "${{ steps.kind.outputs.kind == 'producer' && 'Add producer' || 'Add shop' }} (#${{ github.event.issue.number }})"
          body: |
            Generated from #${{ github.event.issue.number }}.

            ${{ steps.apply.outputs.summary }}

            Tests passed before this PR was opened. Review the diff before merging.

            Closes #${{ github.event.issue.number }}
          commit-message: |
            Apply config request from issue #${{ github.event.issue.number }}

            Generated by .github/workflows/apply-config.yml from an issue form.
          delete-branch: true

      - name: Comment on the issue
        uses: actions/github-script@v7
        with:
          script: |
            const url = "${{ steps.pr.outputs.pull-request-url }}";
            const body = url
              ? `Opened ${url} with this change. Merge it to apply.`
              : `Processed, but no changes were produced — the entry may already exist.`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body + "\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_",
            });

      - name: Report failure on the issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Could not apply this request — see the [run log](${run}) for the reason ` +
                    `(usually a duplicate entry or a field that failed validation). ` +
                    `Edit the issue and re-apply the label to retry.` +
                    "\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_",
            });

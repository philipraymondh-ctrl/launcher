name: Wine Producer Scraper

on:
  schedule:
    # Every two hours, UTC. It used to say hourly, and GitHub never delivered
    # that: the real firing times on a public repo have been 20:22, 22:08,
    # 23:55, 02:24, 05:43, 08:27, 11:17, 13:55 -- gaps of 1.5 to 3 hours,
    # because scheduled runs are queued at low priority and dropped under
    # load. Asking for 24 runs to get 10 only adds queue pressure, and each
    # run now reads every catalogue to its end (11 minutes warm, ~32 cold)
    # rather than the 5 minutes it cost when the cap was 20 pages. Two hours
    # is close to what actually arrives, and it halves what we ask for.
    #
    # It also sits inside the crawler's 6h cache TTL, so a page fetched in one
    # run is still fresh for the next: the extra coverage is paid for roughly
    # four times a day, not every run.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      fresh:
        description: "Bypass the 6h disk cache for this run (FRESH=1)"
        type: boolean
        default: false
      max_requests_per_run:
        description: "Override MAX_REQUESTS_PER_RUN for this run"
        type: string
        default: "400"
      dry_run:
        description: "Print the digest instead of emailing it (sends nothing, changes no state)"
        type: boolean
        default: false

# One scrape at a time. A full pass now takes 11-32 minutes, so a delayed
# schedule can fire the next run while the previous is still crawling: two
# jobs then compete for a runner, double the requests to every shop, and race
# on seen.json. Queueing the second is right -- cancelling it would throw away
# a crawl that is nearly done.
concurrency:
  group: wine-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A cold-cache crawl of 22 polite shops took 8m38s against the old
    # 10-minute ceiling. The scraper stops itself at MAX_RUN_SECONDS and still
    # reports; this is only the outer backstop, so it sits well clear of it.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fixture tests
        run: pytest tests/ -q

      # Best-effort persistence for notify.py's cooldown/dedupe state,
      # market.py's observed-price pool, and crawler.py's 6h disk cache
      # across hourly runs -- runners are
      # ephemeral, so without this every run would look "new" again.
      # actions/cache can be evicted by GitHub at any time; the worst case
      # on a miss is a duplicate alert or an extra fetch, not a broken run.
      - name: Restore scraper state cache
        uses: actions/cache@v4
        with:
          path: |
            seen.json
            observations.json
            .cache
          key: wine-scraper-state-${{ github.run_id }}
          restore-keys: |
            wine-scraper-state-

      - name: Run scraper
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          MAX_REQUESTS_PER_RUN: ${{ inputs.max_requests_per_run || '400' }}
          FRESH: ${{ (inputs.fresh && '1') || '' }}
          # A dry run prints the digest and deliberately persists nothing,
          # so previewing a run cannot put real finds into cooldown.
          DRY_RUN: ${{ (inputs.dry_run && '1') || '' }}
          # Only when a human started this run. The hourly schedule stays
          # quiet unless there is news; a run started from the dashboard
          # always reports what it can currently see, because silence from a
          # run you asked for reads as a broken scraper -- it did, twice.
          FORCE_REPORT: ${{ (github.event_name == 'workflow_dispatch' && '1') || '' }}
        run: python scraper.py

      - name: Upload hits.json artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hits-${{ github.run_id }}
          path: |
            hits.json
            observations.json
            coverage.json
          retention-days: 30

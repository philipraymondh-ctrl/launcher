[pytest]
# The test modules import the top-level modules (scraper, crawler, evaluate,
# notify, pricebook) directly. Without this, only `python -m pytest` works --
# that form happens to put the repo root on sys.path, while a bare `pytest`
# (what the CI workflow runs) does not, so imports fail at collection time.
# Setting pythonpath makes both invocations behave the same.
pythonpath = .
testpaths = tests
